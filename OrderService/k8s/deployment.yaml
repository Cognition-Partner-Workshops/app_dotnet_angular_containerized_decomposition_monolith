apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: order-service
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: Authentication__Authority
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: Authentication__Authority
            - name: Authentication__Audience
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: Authentication__Audience
            - name: ConnectionStrings__OrderDb
              valueFrom:
                secretKeyRef:
                  name: order-service-secret
                  key: ConnectionStrings__OrderDb
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
