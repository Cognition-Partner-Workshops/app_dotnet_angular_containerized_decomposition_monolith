version: '3.8'

# Local development compose: monolith + order-service + PostgreSQL
# Usage: docker compose -f docker-compose.dev.yml up --build

services:
  monolith:
    build:
      context: .
      dockerfile: QuickApp.Server/Dockerfile
    ports:
      - "5225:5225"
    depends_on:
      - sqlserver
      - order-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5225
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=QuickApp;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=true;MultipleActiveResultSets=true
      - Services__OrderServiceUrl=http://order-service:5003

  order-service:
    build:
      context: ../app-dotnet-angular-containerized-decomposition-microservices/src
      dockerfile: Services/Order/Order.API/Dockerfile
    ports:
      - "5003:5003"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=orderdb;Username=postgres;Password=postgres

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
    volumes:
      - sqlserver_data:/var/opt/mssql

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sqlserver_data:
  postgres_data:
